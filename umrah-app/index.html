<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5f56">
<title>Jemaah Juara (Demo)</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0f5f56; --brand-2:#13786c; --brand-soft:#e3f2ef; --gold:#b7791f; --gold-soft:#fdf4e3;
  --ink:#122522; --muted:#64748b; --line:#e5e9ec; --bg:#f4f6f5; --card:#fff;
  --ok:#15803d; --ok-soft:#e8f6ed; --warn:#b45309; --warn-soft:#fff4e0; --bad:#c2410c; --bad-soft:#fff0e8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:#dfe7e5;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.demo-strip{max-width:430px;margin:0 auto;background:#122522;color:#fff;font-size:11.5px;text-align:center;padding:6px 10px}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
@media (min-width:600px){ body{padding:20px 0} .app{min-height:calc(100vh - 72px);border-radius:0 0 24px 24px;overflow:hidden} }
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.top{background:linear-gradient(160deg,var(--brand) 0%,#0b4a43 100%);color:#fff;padding:18px 18px 22px;position:relative}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:19px;font-weight:600;line-height:1.3}
.top .sub{font-size:12.5px;opacity:.8;margin-top:2px}
.lost{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--bad);font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.lost svg.i{width:17px;height:17px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;opacity:.9;margin-bottom:6px}
.back svg.i{width:17px;height:17px}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.h2{font-size:15px;font-weight:600;margin:18px 2px 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:#7a4d0c;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
.note svg.i{width:17px;height:17px;margin-top:1px}
/* countdown */
.count{margin-top:-6px;background:#fff;color:var(--ink);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 24px rgba(10,60,54,.18);position:relative;z-index:2}
.count .big{font-size:38px;font-weight:700;color:var(--brand);line-height:1}
.count .lbl{font-size:12px;color:var(--muted)}
.count b{font-weight:600}
.alert{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border:1px solid #f6d9a8;border-radius:14px;padding:12px 14px}
.alert .ic{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--warn);flex:none}
.alert b{font-size:13.5px;font-weight:600;display:block}
.alert span{font-size:12px;color:#8a5a12}
.alert svg.chev{margin-left:auto;color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:118px}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.tile b{font-size:13.5px;font-weight:600;display:block}
.tile span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.bar{height:7px;background:#e8eeec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2);border-radius:99px;transition:width .4s}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ic{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.li b{font-size:13.5px;font-weight:600;display:block}
.li span{font-size:12px;color:var(--muted)}
.li .r{margin-left:auto;color:#a0aeb9}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-mut{background:#eef2f4;color:var(--muted)}
.day{font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 8px;flex:none;text-align:center;min-width:52px}
/* tabs */
.seg{display:flex;background:#e7ecea;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* lesson */
.lesson h3{font-size:16px;font-weight:600;margin-bottom:4px}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.step{display:flex;gap:12px;font-size:13.5px;line-height:1.55}
.step::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none;margin-top:1px}
.bul{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bul div{display:flex;gap:10px;font-size:13.5px;line-height:1.5}
.bul div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;font-weight:600;font-size:14px;background:var(--brand);color:#fff}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.done{background:var(--ok-soft);color:var(--ok)}
.btn.warn{background:var(--bad);color:#fff}
.btns{display:flex;flex-direction:column;gap:10px}
/* payment */
.money{font-size:28px;font-weight:700;color:var(--ink)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.toggle{display:flex;align-items:center;gap:12px}
.sw{width:44px;height:26px;border-radius:99px;background:#cfd8d6;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand-2)} .sw.on::after{left:21px}
/* visa tracker */
.track{display:flex;flex-direction:column;gap:0}
.tr{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tr:last-child{padding-bottom:0}
.tr .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eef2f4;color:#94a3b8;position:relative;z-index:1}
.tr .dot svg.i{width:15px;height:15px}
.tr.done .dot{background:var(--ok);color:#fff}
.tr.now .dot{background:var(--gold);color:#fff;box-shadow:0 0 0 5px var(--gold-soft)}
.tr::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:#e5e9ec}
.tr:last-child::before{display:none}
.tr.done::before{background:var(--ok)}
.tr b{font-size:13.5px;font-weight:600;display:block}
.tr span{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45;width:100%;text-align:left}
.chk:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:7px;border:1.8px solid #b7c3c0;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.box svg.i{width:14px;height:14px;stroke-width:2.6}
/* lost */
.addr{background:#fff;border:2px solid var(--brand);border-radius:18px;padding:18px;text-align:center}
.addr .ar{font-family:"Noto Naskh Arabic",serif;font-size:26px;font-weight:700;line-height:1.6;direction:rtl}
.addr .ar2{font-family:"Noto Naskh Arabic",serif;font-size:18px;line-height:1.7;direction:rtl;color:#334}
.addr .ms{font-size:13px;color:var(--muted);margin-top:8px}
.show{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:14px}
.show.on{display:flex}
.show .ar{font-family:"Noto Naskh Arabic",serif;font-size:40px;font-weight:700;line-height:1.5;direction:rtl}
.show .ar2{font-family:"Noto Naskh Arabic",serif;font-size:26px;line-height:1.6;direction:rtl}
.show .en{font-size:18px;font-weight:600}
.show .close{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:999px}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#8a97a3;padding:4px 0;border-radius:12px}
nav a.on{color:var(--brand);font-weight:600}
nav a.on svg.i{stroke-width:2.2}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#122522;color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;max-width:360px;width:max-content;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.place p{font-size:13.5px;line-height:1.65;margin-top:8px}
.place .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.offline{display:none;align-items:center;gap:8px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.offline.on{display:flex}
</style>
</head>

  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>',
  chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>',
  check:'<path d="M5 12l5 5L20 7"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  nav:'<path d="M3 11l18-8-8 18-2-8z"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', shirt:'<path d="M8 3l4 2 4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3z"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', loop:'<path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/>',
  walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3"/><path d="M8 11l3-4 3 2 2 3"/><path d="M12 15l-1-4"/>',
  scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 18M8.5 16.5L20 6"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',
  wifi:'<path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/>'
};
const ic = (k, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24">${P[k]||''}</svg>`;

/* ===== Bantuan ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM = n => 'RM' + Number(n).toLocaleString('en-MY');
const BULAN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const tarikh = s => { const d = new Date(s+'T00:00:00'); return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const hariLagi = s => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(s+'T00:00:00') - t)/86400000); };
const dibayar = () => J.bayaran.reduce((a,b)=>a+b.a,0);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2600); }
function header(title, sub, backTo){
  return `<div class="top">${backTo?`<a class="back" href="#${backTo}">${ic('back')}Kembali</a>`:''}
    <div class="row"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>
    <a class="lost" href="#sesat">${ic('pin')}Sesat?</a></div></div>`;
}

/* ===== Skrin ===== */
function vUtama(){
  const d = hariLagi(J.berlepas), baki = J.jumlah - dibayar(), dl = hariLagi(J.akhir);
  const kp = Math.round(S.done.length / KURSUS.length * 100);
  const next = ZIARAH.madinah[0];
  return header(`Assalamualaikum, ${J.nama}`, `${J.pakej} · ${J.kumpulan}`) + `
  <main>
    <div class="count">
      <div><div class="big">${Math.max(d,0)}</div><div class="lbl">hari lagi</div></div>
      <div style="border-left:1px solid var(--line);padding-left:14px"><b>Berlepas ${tarikh(J.berlepas)}</b><div class="lbl">Pulang ${tarikh(J.pulang)} · KLIA</div></div>
    </div>
    <div class="stack" style="margin-top:14px">
      ${baki>0?`<a class="alert" href="#bayaran"><div class="ic">${ic('bell')}</div><div><b>Baki ${RM(baki)} perlu dijelaskan</b><span>Tarikh akhir ${tarikh(J.akhir)}, ${dl>0?dl+' hari lagi':dl===0?'hari ini':'sudah lepas'}</span></div>${ic('chev','chev')}</a>`
        :`<div class="alert" style="background:var(--ok-soft);border-color:#bfe5cb"><div class="ic" style="color:var(--ok)">${ic('check')}</div><div><b style="color:var(--ok)">Bayaran penuh selesai</b></div></div>`}
    </div>
    <div class="h2">Menu</div>
    <div class="grid">
      <a class="tile" href="#kursus"><div class="ic" style="background:var(--brand-soft);color:var(--brand)">${ic('book')}</div><div><b>Kursus umrah</b><span>${S.done.length} daripada ${KURSUS.length} topik siap</span></div><div class="bar"><i style="width:${kp}%"></i></div></a>
      <a class="tile" href="#ziarah"><div class="ic" style="background:var(--gold-soft);color:var(--gold)">${ic('map')}</div><div><b>Tempat ziarah</b><span>Sejarah ringkas Makkah dan Madinah</span></div></a>
      <a class="tile" href="#visa"><div class="ic" style="background:#eef2ff;color:#4338ca">${ic('doc')}</div><div><b>Visa</b><span>${VISA_STEPS.find(s=>s.k==='now')?.t||'Selesai'}</span></div></a>
      <a class="tile" href="#sesat"><div class="ic" style="background:var(--bad-soft);color:var(--bad)">${ic('pin')}</div><div><b>Sesat?</b><span>Alamat hotel dan peta, boleh buka tanpa internet</span></div></a>
    </div>
    <div class="h2">Ziarah pertama</div>
    <a class="list" href="#ziarah"><div class="li"><div class="day">${next.h}</div><div><b>${next.n}</b><span>Madinah</span></div>${ic('chev','r')}</div></a>
    <div class="h2">Hubungi</div>
    <div class="list">
      <button class="li" data-act="wa">${'<div class="ic">'+ic('chat')+'</div>'}<div><b>${J.agent}</b><span>WhatsApp untuk soalan pakej dan bayaran</span></div>${ic('chev','r')}</button>
      <a class="li" href="tel:${MUTAWWIF.tel}"><div class="ic">${ic('phone')}</div><div><b>${MUTAWWIF.nama}</b><span>Mutawwif kumpulan, semasa di Tanah Suci</span></div>${ic('chev','r')}</a>
    </div>
  </main>`;
}
function vKursus(){
  const kp = Math.round(S.done.length / KURSUS.length * 100);
  return header('Kursus umrah', `${S.done.length} daripada ${KURSUS.length} topik siap`) + `
  <main>
    <div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px"><span class="muted">Kemajuan anda</span><b>${kp}%</b></div><div class="bar"><i style="width:${kp}%"></i></div></div>
    <div class="note" style="margin-bottom:12px">${ic('alert')}<div>Kandungan contoh untuk demo. Versi sebenar akan disemak oleh ustaz Juara sebelum digunakan jemaah.</div></div>
    <div class="list">${KURSUS.map((k,i)=>{ const done = S.done.includes(k.id);
      return `<a class="li" href="#kursus/${k.id}"><div class="ic" style="${done?'background:var(--ok-soft);color:var(--ok)':''}">${ic(done?'check':k.ic)}</div><div><b>${i+1}. ${k.t}</b><span>${k.d}</span></div>${done?'<span class="pill p-ok" style="margin-left:auto">Siap</span>':ic('chev','r')}</a>`; }).join('')}</div>
  </main>`;
}
function vLesson(id){
  const k = KURSUS.find(x=>x.id===id); if(!k) return vKursus();
  const i = KURSUS.indexOf(k), done = S.done.includes(k.id), nx = KURSUS[i+1];
  return header(k.t, `Topik ${i+1} daripada ${KURSUS.length}`, 'kursus') + `
  <main class="stack">
    <div class="card lesson">
      <p style="font-size:13.5px;line-height:1.6">${k.intro}</p>
      ${k.steps.length?`<div class="steps">${k.steps.map(s=>`<div class="step">${s}</div>`).join('')}</div>`:''}
      ${k.extra.length?`<div class="bul">${k.extra.map(s=>`<div>${s}</div>`).join('')}</div>`:''}
    </div>
    <div class="note">${ic('alert')}<div>Kandungan contoh. Akan disemak ustaz Juara.</div></div>
    <div class="btns">
      <button class="btn ${done?'done':''}" data-act="done" data-id="${k.id}">${ic('check')}${done?'Ditanda siap':'Tanda siap'}</button>
      ${nx?`<a class="btn sec" href="#kursus/${nx.id}">Topik seterusnya: ${nx.t}</a>`:''}
    </div>
  </main>`;
}
function vZiarah(){
  const loc = S.zloc, list = ZIARAH[loc];
  return header('Tempat ziarah', 'Sejarah ringkas ikut jadual kumpulan') + `
  <main>
    <div class="seg"><button data-z="madinah" class="${loc==='madinah'?'on':''}">Madinah</button><button data-z="makkah" class="${loc==='makkah'?'on':''}">Makkah</button></div>
    <div class="stack">${list.map(z=>`<div class="card place">
      <div style="display:flex;gap:10px;align-items:flex-start"><div class="day">${z.h}</div><div style="flex:1"><b style="font-size:15px;font-weight:600">${z.n}</b><div style="font-family:'Noto Naskh Arabic',serif;font-size:16px;color:var(--muted);direction:rtl;text-align:left">${z.ar}</div></div></div>
      <p>${z.p}</p>
      <div class="meta"><span class="pill p-warn">${ic('alert','').replace('class="i ','class="i " style="width:13px;height:13px" ')}${z.tip}</span></div>
    </div>`).join('')}</div>
    <div class="note" style="margin-top:12px">${ic('alert')}<div>Fakta sejarah ringkas untuk demo. Akan disemak ustaz Juara.</div></div>
  </main>`;
}
function vBayaran(){
  const paid = dibayar(), baki = J.jumlah - paid, pct = Math.round(paid/J.jumlah*100), dl = hariLagi(J.akhir);
  return header('Bayaran', J.pakej) + `
  <main class="stack">
    <div class="card">
      <div class="muted small">Baki perlu dibayar</div>
      <div class="money">${RM(baki)}</div>
      <div style="margin:12px 0 6px" class="bar"><i style="width:${pct}%"></i></div>
      <div style="display:flex;justify-content:space-between" class="small muted"><span>Dibayar ${RM(paid)}</span><span>Jumlah ${RM(J.jumlah)}</span></div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px" class="small">${ic('clock')}<span>Tarikh akhir <b>${tarikh(J.akhir)}</b> ${dl>0?`<span class="pill p-warn">${dl} hari lagi</span>`:''}</span></div>
    </div>
    <div class="card">
      <button class="toggle" data-act="remind" style="width:100%;text-align:left"><div style="flex:1"><b style="font-size:13.5px;font-weight:600">Peringatan bayaran</b><div class="small muted">Ingatkan saya 7 hari dan 3 hari sebelum tarikh akhir</div></div><div class="sw ${S.remind?'on':''}"></div></button>
    </div>
    <div class="card">
      <b style="font-size:14px;font-weight:600">Cara bayar</b>
      <div style="margin-top:8px">
        <div class="kv"><span class="muted">Bank</span><b>${J.bank.nama}</b></div>
        <div class="kv"><span class="muted">No akaun</span><b>${J.bank.akaun}</b></div>
        <div class="kv"><span class="muted">Nama</span><b>${J.bank.pemilik}</b></div>
      </div>
      <div class="btns" style="margin-top:12px">
        <button class="btn" data-act="copy">${ic('bank')}Salin no akaun</button>
        <button class="btn sec" data-act="wa">${ic('chat')}Hantar resit kepada agent</button>
      </div>
    </div>
    <div>
      <div class="h2" style="margin-top:4px">Sejarah bayaran</div>
      <div class="list">${J.bayaran.map(b=>`<div class="li"><div class="ic" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}</div><div><b>${b.k}</b><span>${tarikh(b.t)}</span></div><b style="margin-left:auto;font-size:13.5px">${RM(b.a)}</b></div>`).join('')}</div>
    </div>
  </main>`;
}
function vVisa(){
  return header('Visa umrah', 'Juara uruskan visa anda') + `
  <main class="stack">
    <div class="card">
      <b style="font-size:14px;font-weight:600">Status visa</b>
      <div class="track" style="margin-top:14px">${VISA_STEPS.map(s=>`<div class="tr ${s.k}"><div class="dot">${s.k==='done'?ic('check'):s.k==='now'?ic('clock'):''}</div><div><b>${s.t}</b><span>${s.d}</span></div></div>`).join('')}</div>
    </div>
    <div class="card">
      <b style="font-size:14px;font-weight:600">Dokumen yang perlu dihantar</b>
      <div class="small muted" style="margin:2px 0 6px">Tandakan yang anda sudah hantar kepada Juara</div>
      ${DOKUMEN.map((d,i)=>`<button class="chk ${S.docs.includes(i)?'on':''}" data-doc="${i}"><div class="box">${S.docs.includes(i)?ic('check'):''}</div><div>${d}</div></button>`).join('')}
    </div>
    <div class="card">
      <b style="font-size:14px;font-weight:600">Sebelum berlepas</b>
      <div class="bul">
        <div>Cetak e-Visa dan simpan bersama pasport</div>
        <div>Pasang app Nusuk. Mutawwif akan bantu daftar permit Raudhah</div>
        <div>Simpan salinan pasport dan visa dalam phone</div>
      </div>
    </div>
    <div class="note">${ic('alert')}<div>Proses dan senarai dokumen ialah contoh. Juara akan sahkan keperluan sebenar.</div></div>
  </main>`;
}
function vSesat(){
  const h = HOTEL[S.loc];
  const maps = `https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lng}&travelmode=walking`;
  return header('Sesat? Jangan risau', 'Ikut langkah di bawah', 'utama') + `
  <main class="stack">
    <div class="offline ${navigator.onLine?'':'on'}">${ic('wifi')}Tiada internet. Alamat dan nombor telefon masih boleh digunakan.</div>
    <div class="seg" style="margin-bottom:0"><button data-l="madinah" class="${S.loc==='madinah'?'on':''}">Madinah</button><button data-l="makkah" class="${S.loc==='makkah'?'on':''}">Makkah</button></div>
    <div class="addr">
      <div class="small muted" style="margin-bottom:6px">Hotel anda (${h.hari})</div>
      <div class="ar">${h.ar}</div>
      <div class="ar2">${h.alamatAr}</div>
      <div class="ms"><b style="color:var(--ink)">${h.nama}</b><br>${h.alamat} · ${h.bilik}</div>
    </div>
    <div class="btns">
      <button class="btn" data-act="show">${ic('eye')}Tunjuk pada pemandu atau polis</button>
      <a class="btn sec" href="${maps}" target="_blank" rel="noopener">${ic('nav')}Buka peta ke hotel</a>
      <a class="btn warn" href="tel:${MUTAWWIF.tel}">${ic('phone')}Call mutawwif: ${MUTAWWIF.nama}</a>
    </div>
    <div class="card">
      <b style="font-size:14px;font-weight:600">Jika sesat di dalam masjid</b>
      <div class="bul">
        <div>Berhenti dan jangan ikut orang yang tidak dikenali</div>
        <div>Cari nombor pintu terdekat dan beritahu mutawwif</div>
        <div>Tunggu di tempat berkumpul kumpulan yang telah ditetapkan</div>
      </div>
    </div>
  </main>`;
}
function showDriver(){
  const h = HOTEL[S.loc];
  $('show').innerHTML = `<button class="close" data-act="close">${ic('x')}Tutup</button>
    <div class="ar">${h.ar}</div><div class="ar2">${h.alamatAr}</div>
    <div class="en">${h.nama}</div><div class="muted">${h.alamat}</div>
    <div class="muted small" style="margin-top:10px">Mutawwif: ${MUTAWWIF.tel}</div>`;
  $('show').classList.add('on');
}

/* ===== Router ===== */
const NAV = [['utama','home','Utama'],['kursus','book','Kursus'],['ziarah','map','Ziarah'],['bayaran','wallet','Bayaran'],['visa','doc','Visa']];
function render(){
  const [r, sub] = (location.hash.slice(1) || 'utama').split('/');
  const v = r==='kursus' && sub ? vLesson(sub) : ({utama:vUtama,kursus:vKursus,ziarah:vZiarah,bayaran:vBayaran,visa:vVisa,sesat:vSesat}[r] || vUtama)();
  $('view').innerHTML = v;
  $('nav').innerHTML = NAV.map(([k,i,l])=>`<a href="#${k}" class="${r===k?'on':''}">${ic(i)}${l}</a>`).join('');
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act],[data-z],[data-l],[data-doc]'); if(!a) return;
  if(a.dataset.z){ S.zloc=a.dataset.z; store.set('zloc',S.zloc); render(); return; }
  if(a.dataset.l){ S.loc=a.dataset.l; store.set('loc',S.loc); render(); return; }
  if(a.dataset.doc!=null){ const i=+a.dataset.doc; S.docs = S.docs.includes(i) ? S.docs.filter(x=>x!==i) : S.docs.concat(i); store.set('docs',S.docs); render(); return; }
  const act = a.dataset.act;
  if(act==='done'){ const id=a.dataset.id; S.done = S.done.includes(id) ? S.done.filter(x=>x!==id) : S.done.concat(id); store.set('done',S.done); render(); if(S.done.includes(id)) toast('Bagus, topik ditanda siap'); }
  else if(act==='remind'){ S.remind=!S.remind; store.set('remind',S.remind); render(); toast(S.remind?'Peringatan dihidupkan (demo)':'Peringatan dimatikan'); }
  else if(act==='copy'){ (navigator.clipboard ? navigator.clipboard.writeText(J.bank.akaun.replace(/\s/g,'')) : Promise.reject()).then(()=>toast('No akaun disalin'), ()=>toast('No akaun: '+J.bank.akaun)); }
  else if(act==='wa'){ toast('Demo: akan buka WhatsApp '+J.agent); }
  else if(act==='show'){ showDriver(); }
  else if(act==='close'){ $('show').classList.remove('on'); }
});
window.addEventListener('hashchange', render);
window.addEventListener('online', render); window.addEventListener('offline', render);
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
